<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Redactor</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#1d4ed8; --bg:#f8fafc; --warn:#92400e; --warnbg:#fef3c7; --err:#991b1b; --errbg:#fee2e2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#0f172a; color:#fff; padding:14px 24px; display:flex; align-items:center; gap:12px; }
  header a { color:#fff; text-decoration:none; font-weight:600; font-size:18px; }
  header span { color:#94a3b8; font-size:13px; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:18px; }
  h2 { margin:0 0 12px; font-size:17px; }
  .muted { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns: 1fr 1.3fr; gap:18px; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  textarea { width:100%; min-height:460px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; border:1px solid var(--line); border-radius:8px; padding:10px; }
  input[type=file], select { width:100%; padding:8px; border:1px dashed #cbd5e1; border-radius:8px; background:#f8fafc; }
  button, .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .flash { background:var(--errbg); color:var(--err); padding:10px 14px; border-radius:8px; margin-bottom:14px; }
  .warn { background:var(--warnbg); color:var(--warn); padding:8px 12px; border-radius:8px; margin:6px 0; font-size:14px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#f1f5f9; }
  .pill { display:inline-block; background:#dbeafe; color:#1e40af; border-radius:999px; padding:2px 10px; margin:2px; font-size:13px; }
  pre { white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:12.5px; max-height:520px; overflow:auto; }
  .preview img { max-width:100%; border:1px solid var(--line); border-radius:6px; margin-bottom:10px; }
  label { font-weight:600; font-size:14px; display:block; margin:12px 0 6px; }
  code { background:#f1f5f9; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}">Document Redactor</a><span>Rules-driven redaction for PDF, Word, Excel and text files</span></header>
<main>
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
