[project]
name = "cvm-aer"
version = "1.0.0"
description = "Form FDA 1932 / 1932a veterinary adverse event reports -> VICH GL42 XML"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]

[project.scripts]
cvm-aer = "cvm_aer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cvm_aer"]

[tool.setuptools.package-data]
cvm_aer = ["templates/*.json"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
